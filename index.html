<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call of Booty — Phase 1</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d1116'/><rect x='7' y='2' width='2' height='12' fill='%237fd4ff'/><rect x='2' y='7' width='12' height='2' fill='%237fd4ff'/></svg>"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1116; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e8ecf0; }
      canvas { display: block; }

      #hint {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.25rem;
        background: rgba(8, 12, 16, 0.82); backdrop-filter: blur(3px);
        text-align: center; z-index: 20; cursor: pointer; padding: 2rem;
      }
      #hint h1 { margin: 0 0 0.25rem; font-size: clamp(1.5rem, 4vw, 2.6rem); letter-spacing: 0.04em; }
      #hint h1 small { font-weight: 400; opacity: 0.55; font-size: 0.5em; }
      #hint .lead { margin: 0 0 1.5rem; opacity: 0.8; }
      #hint table { border-collapse: collapse; font-size: 0.85rem; }
      #hint td { padding: 0.2rem 0.9rem; text-align: left; }
      #hint td:first-child { color: #7fd4ff; text-align: right; white-space: nowrap; }
      #hint td:last-child { opacity: 0.75; }

      #crosshair { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 10; }
      #crosshair span {
        position: absolute; left: 50%; top: 50%; background: #e8ecf0;
        transform: translate(-50%, -50%); opacity: 0.85;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      }
      #crosshair span:nth-child(1) { width: 2px; height: 12px; }
      #crosshair span:nth-child(2) { width: 12px; height: 2px; }

      #debug-overlay {
        position: fixed; top: 10px; left: 10px; z-index: 30;
        background: rgba(8, 12, 16, 0.78); border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px; padding: 10px 12px; font-size: 12px; line-height: 1.5;
        min-width: 250px; pointer-events: none;
      }
      #debug-overlay hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 6px 0; }
      #debug-overlay b { color: #7fd4ff; }
      #debug-overlay .dim { opacity: 0.55; }

      #loading {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #0d1116; z-index: 40; font-size: 0.95rem;
        letter-spacing: 0.08em; opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="loading">GENERATING WORLD…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
