<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call of Booty — Phase 1</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d1116'/><rect x='7' y='2' width='2' height='12' fill='%237fd4ff'/><rect x='2' y='7' width='12' height='2' fill='%237fd4ff'/></svg>"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1116; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e8ecf0; }
      canvas { display: block; }

      #hint {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.25rem;
        background: rgba(8, 12, 16, 0.82); backdrop-filter: blur(3px);
        text-align: center; z-index: 20; padding: 2rem;
        /* Overlay is pass-through; only #hint-play captures clicks. */
        pointer-events: none;
      }
      #hint .hint-play,
      #hint #hint-play {
        pointer-events: auto !important;
        cursor: pointer;
      }
      #hint .err { color: #ff9a7f; margin-top: 1.2rem; font-size: 0.8rem; min-height: 1em; max-width: 28rem; }
      #hint h1 { margin: 0 0 0.25rem; font-size: clamp(1.5rem, 4vw, 2.6rem); letter-spacing: 0.04em; }
      #hint h1 small { font-weight: 400; opacity: 0.55; font-size: 0.5em; }
      #hint .lead { margin: 0 0 1.5rem; opacity: 0.8; }
      #hint table { border-collapse: collapse; font-size: 0.85rem; }
      #hint td { padding: 0.2rem 0.9rem; text-align: left; }
      #hint td:first-child { color: #7fd4ff; text-align: right; white-space: nowrap; }
      #hint td:last-child { opacity: 0.75; }

      #crosshair { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 10; }
      #crosshair span {
        position: absolute; left: 50%; top: 50%; background: #e8ecf0;
        transform: translate(-50%, -50%); opacity: 0.85;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      }
      #crosshair span:nth-child(1) { width: 2px; height: 12px; }
      #crosshair span:nth-child(2) { width: 12px; height: 2px; }

      #debug-overlay {
        position: fixed; top: 10px; right: 10px; z-index: 30;
        background: rgba(8, 12, 16, 0.78); border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px; padding: 10px 12px; font-size: 12px; line-height: 1.5;
        min-width: 250px; pointer-events: none;
      }
      #debug-overlay hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 6px 0; }
      #debug-overlay b { color: #7fd4ff; }
      #debug-overlay .dim { opacity: 0.55; }

      /* Square minimap — top left */
      #minimap {
        position: fixed; top: 12px; left: 12px; z-index: 25;
        width: 168px; height: 168px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        background: rgba(8, 12, 16, 0.85);
        pointer-events: none;
      }
      #minimap .map-canvas { display: block; width: 100%; height: 100%; }
      #minimap .map-label {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 2px 6px 3px;
        font-size: 9px; letter-spacing: 0.12em;
        text-align: center; color: rgba(232, 236, 240, 0.75);
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
      }

      /* Full tactical map — M key */
      #fullmap {
        position: fixed; inset: 0; z-index: 35;
        display: none; align-items: center; justify-content: center;
        background: rgba(4, 8, 12, 0.72);
        backdrop-filter: blur(4px);
        pointer-events: none;
      }
      #fullmap.is-open {
        pointer-events: auto;
      }
      #fullmap .fullmap-panel {
        display: flex; flex-direction: column; gap: 8px;
        padding: 12px 14px 10px;
        background: rgba(8, 12, 16, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        pointer-events: auto;
      }
      #fullmap .fullmap-header,
      #fullmap .fullmap-footer {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 1rem; font-size: 12px;
      }
      #fullmap .fullmap-title {
        color: #7fd4ff; letter-spacing: 0.1em; font-weight: 600;
      }
      #fullmap .fullmap-hint { opacity: 0.5; }
      #fullmap .fullmap-coords { color: #7fd4ff; }
      #fullmap .fullmap-nearest { opacity: 0.75; text-align: right; }
      #fullmap .fullmap-stage {
        position: relative;
        pointer-events: auto;
      }
      #fullmap .map-canvas {
        display: block;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        cursor: grab;
        pointer-events: auto;
        touch-action: none;
      }
      #fullmap .fullmap-zoom {
        position: absolute; right: 10px; bottom: 10px;
        display: flex; flex-direction: column; gap: 6px;
        pointer-events: auto;
      }
      #fullmap .fullmap-zoom-btn {
        width: 34px; height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        background: rgba(12, 18, 24, 0.88);
        color: #e8ecf0;
        font-size: 18px; line-height: 1;
        cursor: pointer;
        pointer-events: auto;
      }
      #fullmap .fullmap-zoom-btn:hover {
        border-color: #7fd4ff;
        color: #7fd4ff;
      }

      #loading {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #0d1116; z-index: 40; font-size: 0.95rem;
        letter-spacing: 0.08em; opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="loading">GENERATING WORLD…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
